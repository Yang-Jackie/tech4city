[project]
name = "tech4city-backend"
version = "0.1.0"
description = "Minimal offline backend skeleton for tech4city"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "pymongo>=4.13,<5",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
