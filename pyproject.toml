[project]
name = "tech4city"
version = "0.1.0"
description = "Local tech4city application, browser-managed Telegram client, and research utilities"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<1",
    "pymongo>=4.13,<5",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = [
    "peft>=0.19.1,<1",
    "torch>=2.7,<3",
    "transformers>=4.52,<5",
]
layer2 = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
    "torch>=2.7,<3",
]
layer3 = [
    "openai>=1,<3",
]
research = [
    "gensim>=4.3,<5",
    "matplotlib>=3.9,<4",
    "networkx>=3.3,<4",
    "node2vec>=0.5,<1",
    "numpy>=1.26,<3",
    "openai>=1,<3",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6",
    "tqdm>=4.66,<5",
    "wordcloud>=1.9,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "uv>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
